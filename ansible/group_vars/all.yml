# Shared settings. Host addresses, domains and realms come from inventory.ini (generated by Terraform).

# Passwords are generated on first use and kept on the controller (rhel-server) in this directory.
# Read them with: sudo -u ec2-user cat ~ec2-user/.doclab-secrets/<name>
secrets_dir: /home/ec2-user/.doclab-secrets

ipaadmin_password: "{{ lookup('ansible.builtin.password', secrets_dir ~ '/ipa_admin', chars=['ascii_letters', 'digits'], length=24) }}"
ipadm_password: "{{ lookup('ansible.builtin.password', secrets_dir ~ '/ipa_directory_manager', chars=['ascii_letters', 'digits'], length=24) }}"
graylog_admin_password: "{{ lookup('ansible.builtin.password', secrets_dir ~ '/graylog_admin', chars=['ascii_letters', 'digits'], length=24) }}"
graylog_password_secret: "{{ lookup('ansible.builtin.password', secrets_dir ~ '/graylog_password_secret', chars=['ascii_letters', 'digits'], length=64) }}"
openvas_admin_password: "{{ lookup('ansible.builtin.password', secrets_dir ~ '/openvas_admin', chars=['ascii_letters', 'digits'], length=24) }}"
glpi_db_password: "{{ lookup('ansible.builtin.password', secrets_dir ~ '/glpi_db', chars=['ascii_letters', 'digits'], length=24) }}"
glpi_db_root_password: "{{ lookup('ansible.builtin.password', secrets_dir ~ '/glpi_db_root', chars=['ascii_letters', 'digits'], length=24) }}"

# FreeIPA lab users (passwords generated into secrets_dir/ipa_user_<name>).
# Add `sshpubkey: "ssh-ed25519 AAAA..."` to a user to allow key-based SSH as well.
ipa_lab_users:
  - name: labadmin
    first: Lab
    last: Admin
    title: Lab administrator
    groups: [admins, it-admins]
  - name: itadmin
    first: IT
    last: Admin
    title: IT administrator
    groups: [it-admins]

# Container images (pinned so re-runs are repeatable)
graylog_image: graylog/graylog:6.1
opensearch_image: opensearchproject/opensearch:2.15.0
mongodb_image: mongo:7.0
snort_image: ciscotalos/snort3:latest
glpi_image: glpi/glpi:10.0
mariadb_image: mariadb:11.4
nginx_image: nginx:1.27-alpine

# Greenbone Community Edition compose file (official)
greenbone_compose_url: https://greenbone.github.io/docs/latest/_static/docker-compose.yml

# OpenVPN
openvpn_network: 10.8.0.0
openvpn_netmask: 255.255.255.0
openvpn_clients:
  - lab-admin

# Hosts with less RAM than this get a swap file
swap_below_mb: 4000
swap_size_mb: 2048
